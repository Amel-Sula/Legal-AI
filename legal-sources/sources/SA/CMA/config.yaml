fetch:
  max_retries: 3
  rate_limit: 2.0
  timeout: 120
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: title
    required: true
    type: string
  - name: category
    required: false
    type: string
source:
  auth: none
  country: SA
  data_types:
  - legislation
  description: >-
    Saudi Capital Market Authority (CMA) implementing regulations, rules, and
    instructions from cma.gov.sa. Parses the regulations list page for PDF
    links, downloads each PDF, and extracts full text. ~36 regulations covering
    securities, investment funds, corporate governance, market conduct, etc.
    Plus the Capital Market Law itself.
  id: SA/CMA
  name: Saudi CMA Regulations
  url: https://cma.gov.sa/en/RulesRegulations/Regulations/Pages/default.aspx
license:
  name: Open Government Data
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Saudi government regulatory publications
