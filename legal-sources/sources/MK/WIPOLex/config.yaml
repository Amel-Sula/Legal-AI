source:
  id: MK/WIPOLex
  country: MK
  name: "North Macedonia Legislation (WIPO Lex)"
  url: https://www.wipo.int/wipolex/en/members/profile/MK
  data_types:
    - legislation
  language: en
license:
  name: "Public domain (national legislation)"
  url: https://www.wipo.int/wipolex/en/disclaimer
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    The documents are official legislative texts of North Macedonia (the
    Constitution, codes and acts), which are not subject to copyright. WIPO Lex
    republishes them free of charge as a public gateway. No usage restriction
    is placed on the underlying legal texts.
fetcher:
  type: html_profile_pdf
  rate_limit: 1.5
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: title
      required: true
      type: string
    - name: text
      required: true
      type: string
  date_fields:
    - _fetched_at
    - date
  text_fields:
    - text
    - title
data_model:
  update_strategy: upsert
  dedup_key:
    - _id
notes: >
  North Macedonia legislation (Constitution, Penal Code, Code of Criminal
  Procedure, Customs Code, Law on Copyright and Related Rights, Law on
  Industrial Property and related acts) from the WIPO Lex database. The WIPO Lex
  North Macedonia member profile is server-rendered HTML listing each text with
  its adoption date and a detail-page link; each detail page exposes a
  CloudFront-signed PDF download URL (the signed query string is required). Full
  text is extracted from the PDFs, English WIPO translation preferred with the
  Macedonian original as fallback. A few older originals are scanned image-only
  PDFs with no text layer and are skipped.
