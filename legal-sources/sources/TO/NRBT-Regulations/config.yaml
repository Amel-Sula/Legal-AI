source:
  id: TO/NRBT-Regulations
  name: National Reserve Bank of Tonga — Regulatory Framework
  country: TO
  url: https://www.reservebank.to/index.php/about-us/our-regulatory-frameworks
  description: >
    Banking legislation, regulations, prudential statements, and AML
    guidelines from the National Reserve Bank of Tonga. Covers Banking
    Act 2020, Money Laundering Act 2025, FX controls, prudential
    standards 1-15. Full text extracted from PDFs.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: language
      type: string
      required: true

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: Public Domain (Government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Kingdom of Tonga government legislation and banking regulations
