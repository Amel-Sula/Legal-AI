source_id: BZ/CourtOfAppeal
name: Belize Court of Appeal Judgments
country: BZ
url: https://judiciary.bz/judgements3/
data_types:
  - case_law

description: >
  Court of Appeal judgments from the Judiciary of Belize. Covers Criminal
  Appeals (1977-2022) and Civil Appeals (1987-2022). Judgments are published
  as PDFs by the Office of the Registrar General.

schedule:
  frequency: monthly
  mode: full

schema:
  key_fields:
    - _id
    - title
    - appeal_number
    - appeal_type
    - date
    - court
    - url
    - text

license:
  name: "Public Domain"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government court decisions are public domain in Belize."
