  country: GD
  name: "Grenada Government Gazette (Parliament)"
  url: https://grenadaparliament.gd/cat_doc/the-grenadian-government-gazette/
  data_types:
    - legislation
  language: en
license:
  name: "Government of Grenada (Open Access)"
  url: https://grenadaparliament.gd
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
