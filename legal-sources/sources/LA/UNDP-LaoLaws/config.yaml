source:
  id: "LA/UNDP-LaoLaws"
  country: "LA"
  name: "Lao Laws (UNDP Official English Translations)"
  url: "https://www.luangprabang-laos.com/Lao-laws"
  description: |
    33 major Lao PDR laws officially translated into English by UNDP/Singapore/NUS
    collaboration. Covers constitution, business, criminal, civil procedure, family,
    property, tax, labour, land, and other key legislation.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 2

api:
  type: "html_scrape"
  base_url: "https://www.luangprabang-laos.com"

data_model:
  type: "legislation"
  source_nature: "consolidated"
  primary_key: "pdf_filename"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "pdf_filename"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Unique identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Law title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Translation date (March 2006)"
      type: "date"
      role: "temporal_key"
      required: false

license:
  id: "pd-gov"
  name: "Public Domain (Government Legislation)"
  url: "https://www.luangprabang-laos.com/Lao-laws"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official English translations of Lao government legislation by UNDP/Singapore/NUS."
