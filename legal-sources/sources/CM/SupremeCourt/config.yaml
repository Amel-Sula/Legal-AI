source:
  id: "CM/SupremeCourt"
  country: "CM"
  name: "Cameroon Supreme Court (Cour Suprême)"
  url: "https://juricaf.org/recherche/+/facet_pays:Cameroun"
  description: |
    Decisions from Cameroon courts via juricaf.org (AHJUCAF database).
    Covers Supreme Court, Constitutional Council, Courts of Appeal,
    and High Courts. ~514 decisions. Bilingual (French/English)
    common/civil law mixed system. Full text via Juricaf HTML pages.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 1

data_model:
  type: "case_law"
  primary_key: "decision_id"
  update_strategy: "upsert"
  dedup_key:
    - "decision_id"

schema:
  total_fields: 9
  key_fields:
    - name: "decision_id"
      description: "Juricaf decision identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Decision title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the court decision"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Decision date (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "court"
      description: "Court name"
      type: "string"
      role: "category"
      required: false
    - name: "docket_number"
      description: "Case/docket number"
      type: "string"
      role: "identifier"
      required: false
    - name: "url"
      description: "URL on juricaf.org"
      type: "string"
      role: "reference"
      required: true

license:
  name: "Public domain (government decisions)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Government judicial decisions from Cameroon courts via Juricaf/AHJUCAF."
