source:
  id: LC/NPC-Acts
  country: LC
  name: "Saint Lucia Acts of Parliament (NPC)"
  url: https://npc.govt.lc/laws/acts
  data_types:
    - legislation
  language: en
license:
  name: "Government of Saint Lucia (Open Access)"
  url: https://npc.govt.lc/
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official Acts of Parliament published by the Saint Lucia National Printing Corporation. Government documents are public records."
fetcher:
  type: html_scraper
  pagination: year_pages
  rate_limit: 2.0
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: act_number
      required: true
      type: integer
  date_fields:
    - date
    - _fetched_at
  text_fields:
    - text
    - title
notes: >
  500-800+ Acts of Parliament from 2003-2026, organized by year.
  PDFs downloaded via base64-encoded download URLs.
  Full text extracted via pdfplumber.
