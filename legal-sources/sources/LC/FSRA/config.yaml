  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory publications from Saint Lucia FSRA"

language: en

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

update_frequency: quarterly

schema:
  key_fields:
    - name: title
      required: true
      type: string
    - name: url
      required: true
      type: string
  date_field: date
  text_field: text
  title_field: title
  url_field: url

notes: |
  Joomla site with legislation and guidelines across multiple sector-specific
  pages. PDFs hosted in /images/ directory. Scrapes HTML pages for PDF links,
  then downloads and extracts text.
