source_id: LC/FSRA
name: Saint Lucia Financial Services Regulatory Authority
country: LC
url: https://fsrastlucia.org/
description: |
  Legislation, regulations, guidelines, and directives from Saint Lucia's
  Financial Services Regulatory Authority. Covers insurance, pensions, credit
  unions, international banking, money services, virtual assets, and registered
  agents. Full text extracted from official PDFs.

data_types:
  - legislation
  - doctrine

license:
