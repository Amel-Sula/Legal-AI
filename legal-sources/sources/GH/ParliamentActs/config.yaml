# ===================================================================
# GH/ParliamentActs -- Ghana Parliament Acts (DSpace Repository)
# ===================================================================
# Official Parliament of Ghana institutional repository.
# DSpace 7+ REST API provides structured metadata and pre-extracted
# full text from PDF documents — no PDF parsing required.
# ===================================================================

source:
  id: "GH/ParliamentActs"
  country: "GH"
  name: "Ghana Parliament Acts Database"
  url: "https://repository.parliament.gh/"
  description: |
    Acts of Parliament of Ghana from 1960 onwards, hosted in the
    official Parliament DSpace institutional repository. Covers
    1st–4th Republic Acts plus 1st–8th Parliament Acts (~990 items).
    Full text pre-extracted from PDFs by DSpace indexing engine.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3
  notes: "DSpace REST API. 1-second delay between requests."

api:
  type: "rest"
  base_url: "https://repository.parliament.gh/server/api"
  endpoints:
    communities: "/core/communities?size=100"
    search: "/discover/search/objects?scope={community_id}&dsoType=ITEM&size={size}&page={page}"
    item: "/core/items/{uuid}"
    bundles: "/core/items/{uuid}/bundles"
    bitstreams: "/core/bundles/{bundle_uuid}/bitstreams"
    content: "/core/bitstreams/{bitstream_uuid}/content"
  response_format: "json"

data_model:
  type: "legislation"
  primary_key: "uuid"
  update_strategy: "upsert"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "DSpace item UUID"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Act title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF by DSpace"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Date issued (publication/enactment)"
      type: "date"
      role: "temporal_key"
      required: true
    - name: "url"
      description: "Handle URL to original repository item"
      type: "string"
      role: "reference"
      required: true

license:
  id: "ogd"
  name: "Open Government Data (Parliament of Ghana)"
  url: "https://repository.parliament.gh/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official Parliament institutional repository. DSpace open access."

notes: |
  - DSpace 7+ REST API at repository.parliament.gh
  - Full text via TEXT bundle bitstreams (pre-extracted from PDFs)
  - ~990 Acts across 9 communities covering 1st Republic to 8th Parliament
  - English language
  - Some items may lack TEXT bundles (scanned PDFs without OCR)
