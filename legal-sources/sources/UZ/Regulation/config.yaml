source:
  id: "UZ/Regulation"
  country: "UZ"
  name: "Uzbekistan Draft Laws Public Discussion (regulation.gov.uz)"
  url: "https://regulation.gov.uz"
  description: |
    Portal for public discussion of draft normative-legal acts in Uzbekistan.
    Contains ~9,000 draft laws, cabinet resolutions, and regulatory documents
    with full text, published since 2015. Includes regulatory impact assessments
    and explanatory memoranda. Uzbek and Russian languages.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: "html_scrape"
  base_url: "https://regulation.gov.uz"

data_model:
  type: "legislation"
  source_nature: "draft_legislation"
  primary_key: "id"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "id"

schema:
  total_fields: 10
  key_fields:
    - name: "id"
      description: "Document ID from regulation.gov.uz"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Title of the draft law/regulation"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the draft document"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Publication date of the draft"
      type: "date"
      role: "temporal_key"
      required: true
  secondary_fields:
    - name: "author"
      description: "Issuing authority / project creator"
    - name: "document_type"
      description: "Type of draft document"
    - name: "end_date"
      description: "Discussion end date"
    - name: "comments_count"
      description: "Number of public comments"
    - name: "language"
      description: "Language (uz/ru)"
    - name: "url"
      description: "Direct link to document page"

license:
  name: "Public domain (government)"
  url: "https://regulation.gov.uz"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government draft legislation portal for public discussion"

notes: |
  - HTML scraping from regulation.gov.uz listing and document pages
  - ~9,000 documents across 450 listing pages
  - Full text in tab_content_in divs on document pages
  - Metadata (author, dates, comments) from table on document pages
  - Draft laws, cabinet resolutions, regulatory amendments
