source:
  id: "UZ/ConstitutionalCourt"
  country: "UZ"
  name: "Uzbekistan Constitutional Court Decisions"
  url: "https://www.konstsud.uz"
  description: |
    Constitutional Court of the Republic of Uzbekistan decisions.
    Small corpus of ~15-20 decisions since 2021. Uzbek language.
    PDFs scraped from the court's official website.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: "html_scrape"
  base_url: "https://www.konstsud.uz"

data_model:
  type: "case_law"
  source_nature: "gazette"
  primary_key: "id"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "id"

schema:
  total_fields: 8
  key_fields:
    - name: "id"
      description: "PDF filename-based ID"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Title of the decision"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Approximate date from upload path"
      type: "date"
      role: "temporal_key"
      required: true
  secondary_fields:
    - name: "language"
      description: "Language (uz)"
    - name: "url"
      description: "Direct link to PDF"

license:
  id: "pd-gov"
  name: "Public domain (government)"
  url: "https://www.konstsud.uz"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government court decisions"

notes: |
  - PDFs scraped from decisions page, text extracted via pypdf
  - ~15 decisions with extractable text, 2 are scanned images
  - Uzbek language content
  - Small but complete corpus since court's 2021 reconstitution
