source:
  id: TD/CourSupremeJuricaf
  country: TD
  name: "Chad Supreme Court (Juricaf)"
  url: https://juricaf.org/recherche/+/facet_pays:Tchad
  data_types:
    - case_law
  language: fr
license:
  name: "Open Access (Juricaf/AHJUCAF)"
  url: https://juricaf.org
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Court decisions published on Juricaf by AHJUCAF (Association des Hautes Juridictions de Cassation des pays ayant en partage l'usage du français)."
fetcher:
  type: api_json
  pagination: page_number
  rate_limit: 2.0
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: docket_number
      required: false
      type: string
  date_fields:
    - date
    - _fetched_at
  text_fields:
    - text
    - title
notes: >
  451 Supreme Court decisions (1999-2021) via Juricaf JSON API.
  Full text extracted from decision HTML pages (div#textArret).
