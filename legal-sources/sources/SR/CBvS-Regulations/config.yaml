source:
  id: SR/CBvS-Regulations
  name: Centrale Bank van Suriname — Regulations
  country: SR
  url: https://www.cbvs.sr/
  data_types:
    - doctrine
  description: |
    Regulatory documents from the Centrale Bank van Suriname — banking laws,
    supervision guidelines (richtlijnen), AML/CFT directives, circulars,
    insurance and pension fund regulations. ~80-100 documents.
    Full text extracted from PDFs. Content in Dutch and English.

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: html_scrape_pdf
  base_url: https://www.cbvs.sr
  format: pdf

schema:
  key_fields:
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: string
      required: false
    - name: pdf_url
      type: string
      required: true

license:
  name: Public Domain (Government of Suriname)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Official central bank regulations published for public access on cbvs.sr.
