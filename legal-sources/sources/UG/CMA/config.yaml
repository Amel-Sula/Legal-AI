# ===================================================================
# UG/CMA -- Uganda Capital Markets Authority
# ===================================================================

source:
  id: "UG/CMA"
  country: "UG"
  name: "Uganda Capital Markets Authority"
  url: "https://cmauganda.co.ug/"
  description: |
    Regulatory notices, market guidelines, enforcement decisions, and
    annual reports from Uganda's Capital Markets Authority. 351 PDFs
    via WP Media API with text extraction, plus 49 posts with inline text.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "wordpress_rest"
  base_url: "https://cmauganda.co.ug/wp-json/wp/v2"
  endpoints:
    - "/media?media_type=application (351 attachments, PDFs filtered)"
    - "/posts (49 posts)"
    - "/categories"
  notes: "Reports, guidelines, communiqués. PDFs extracted via pdfplumber."

data_model:
  type: "doctrine"
  primary_key: "_id"
  update_strategy: "append_only"

schema:
  total_fields: 10
  key_fields:
    - name: "text"
      description: "Full text from PDF or WP post content"
      type: "string"
      role: "content"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "document_type"
      description: "Category: rapport, guideline, communique, etc."
      type: "string"
      role: "status"
      required: false

license:
  name: "Public Government Documents (Uganda)"
  url: null
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory documents from Uganda CMA"
