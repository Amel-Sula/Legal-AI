source:
  id: "MZ/CourtSupremo"
  country: "MZ"
  name: "Mozambique Supreme Court (Tribunal Supremo)"
  url: "https://www.ts.gov.mz"
  description: |
    Court decisions (acórdãos) from the Supreme Court of Mozambique (Tribunal
    Supremo). Accessed via WordPress REST API media endpoint. Full text extracted
    from PDF attachments using pdfplumber. ~1400 decisions covering civil, labor,
    criminal, and administrative matters. Content in Portuguese.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: "rest"
  base_url: "https://www.ts.gov.mz"
  endpoints:
    media: "/wp-json/wp/v2/media?per_page=100&mime_type=application/pdf&page={N}"

data_model:
  type: "case_law"
  source_nature: "consolidated"
  primary_key: "doc_id"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "doc_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Unique identifier (MZ/CourtSupremo/{media_id})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Case title / process number"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the decision (extracted from PDF)"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Upload date (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: true
  secondary_fields:
    - name: "url"
      description: "Direct link to PDF decision"
    - name: "court"
      description: "Court name"
    - name: "process_number"
      description: "Case process number extracted from title"
  probably_ignorable: []

license:
  id: "pd-gov"
  name: "Public Domain (Government)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official court decisions are public domain under Mozambican law"

notes: |
  - WordPress site with REST API at /wp-json/wp/v2/media
  - ~1414 PDF attachments, predominantly court decisions
  - Full text extracted via pdfplumber
  - Portuguese language content
  - Decisions span from 1989 to present
