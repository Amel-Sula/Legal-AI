name: Paraguay CONACOM — Competition Authority Decisions
notes: 'Comisión Nacional de la Competencia (CONACOM), Paraguay''s competition
  authority under Ley N° 4956/2013. Two public "historial de expedientes" pages
  list every released document for control-of-concentrations and restrictive-practices
  cases: resoluciones (RAL), directorate opinions (DIPARCC), authorizations,
  cautelares, sanctions. Each row links a Google Drive PDF. Mix of digital and
  scanned PDFs; scanned images yield no text and are skipped. Full text extracted
  from digital PDFs via common.pdf_extract (opendataloader → pdfplumber → pypdf).'
schedule: monthly
