# MA/ANRT - Morocco ANRT Telecom Regulatory Decisions
name: "Morocco ANRT Telecom Regulatory Decisions"
country: MA
source_id: "MA/ANRT"
source_type: doctrine

base_url: "https://www.anrt.ma"
official_url: "https://www.anrt.ma/en/reglementation/decisions"

data_types:
  - doctrine
  - legislation

languages:
  - fr

coverage:
  start_year: 1997
  end_year: 2026
  notes: "Telecom regulatory decisions, arrêtés, laws, and decrees from ANRT (Morocco). Full text via PDF extraction."

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

data_model:
  update_strategy: upsert
  dedup_key:
    - _id

schema:
  key_fields:
    - name: "category"
      type: "string"
      required: true
    - name: "text"
      type: "string"
      required: true
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url

license:
  name: "Open Government Data"
  url: "https://www.anrt.ma/en/reglementation/decisions"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory documents published by Morocco's telecom regulator (ANRT)"
