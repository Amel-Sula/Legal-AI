# MA/BankAlMaghrib - Bank Al-Maghrib Circulars & Regulations
name: "Bank Al-Maghrib Circulars & Regulations"
country: MA
source_id: "MA/BankAlMaghrib"
source_type: legislation

base_url: "https://www.bkam.ma"
official_url: "https://www.bkam.ma/Trouvez-l-information-concernant/Reglementation"

data_types:
  - legislation
  - doctrine

languages:
  - fr
  - ar

coverage:
  start_year: 1993
  end_year: 2026
  notes: "Banking regulations, circulars, directives, instructions from Bank Al-Maghrib (Morocco central bank). ~23% of PDFs have extractable text; scanned PDFs are skipped."

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

data_model:
  update_strategy: upsert
  dedup_key:
    - _id

schema:
  key_fields:
    - name: "category"
      type: "string"
      required: true
    - name: "text"
      type: "string"
      required: true
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url

license:
  name: "Open Government Data"
  url: "https://www.bkam.ma/en/Find-information-about/Legal-notice"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory documents published by Morocco's central bank"
