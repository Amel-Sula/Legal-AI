source:
  id: IT/Sicilia
  name: Leggi della Regione Siciliana
  country: IT
  url: https://w3.ars.sicilia.it/home/cerca/201.jsp
  data_types:
    - legislation
  auth: none
  description: >
    Regional laws (leggi regionali) of the Sicilian Region from the Banche Dati
    of the Assemblea Regionale Siciliana (ARS). Each law is served as a single
    consolidated HTML document at /lex/L_{year}_{number}.htm, covering the
    I Legislatura (1947) to present. Full text (all articles) is extracted from
    the HTML.

fetch:
  max_retries: 3
  rate_limit: 1.0
  timeout: 60

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: law_number
      type: string
      required: false

license:
  name: "Public domain (official acts)"
  url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1941-04-22;633!vig="
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Regional laws are official acts of a public administration and are not
    protected by copyright under Art. 5 of the Italian Copyright Law
    (Legge 22 aprile 1941, n. 633).
