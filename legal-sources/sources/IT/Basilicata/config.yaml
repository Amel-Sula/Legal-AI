source:
  id: IT/Basilicata
  name: Legislazione Regionale Basilicata
  country: IT
  url: https://atticonsiglio.consiglio.basilicata.it/AD_Elenco_Leggi
  data_types:
    - legislation
  auth: none
  description: >
    Regional laws (leggi regionali) of the Basilicata Region from the
    Consiglio Regionale della Basilicata's legislative database. Each law
    is accessible via a stable URL at /AD_Elenco_Leggi?Codice=N where N is
    an internal database ID (1 to ~2389). Full consolidated text is extracted
    from the HTML (WordSection1 container). Coverage: 1971-present, ~2350 laws.

fetch:
  max_retries: 3
  rate_limit: 1.0
  timeout: 60

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: law_number
      type: string
      required: false

license:
  name: "Public domain (official acts)"
  url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1941-04-22;633!vig="
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Regional laws are official acts of a public administration and are not
    protected by copyright under Art. 5 of the Italian Copyright Law
    (Legge 22 aprile 1941, n. 633).
