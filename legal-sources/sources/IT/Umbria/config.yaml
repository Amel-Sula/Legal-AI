source:
  id: IT/Umbria
  name: Legislazione Regionale Umbria
  country: IT
  url: http://leggi.crumbria.it/leggi_01.php
  data_types:
    - legislation
  auth: none
  description: >
    Regional laws (leggi regionali) of the Umbria Region from the Assemblea
    Legislativa dell'Umbria legislative database (leggi.crumbria.it). Each law
    is published as a NIR (Norme in Rete) XML document at a stable URL
    /xml/lr{YYYY}-{NN}.xml. Full consolidated ("multivigente") text is
    extracted from the <articolato> element; metadata from the NIR header.
    Coverage: 1971-present, ~1400+ regional laws.

fetch:
  max_retries: 3
  rate_limit: 1.0
  timeout: 60

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: law_number
      type: string
      required: false
    - name: urn
      type: string
      required: false

license:
  name: "Public domain (official acts)"
  url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1941-04-22;633!vig="
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Regional laws are official acts of a public administration and are not
    protected by copyright under Art. 5 of the Italian Copyright Law
    (Legge 22 aprile 1941, n. 633).
