source:
  id: IT/FriuliVeneziaGiulia
  name: Legislazione Regionale Friuli Venezia Giulia
  country: IT
  url: https://lexview-int.regione.fvg.it/FontiNormative/xml/index.aspx
  data_types:
    - legislation
  auth: none
  description: >
    Regional laws (leggi regionali) of Friuli Venezia Giulia from the LexView
    database of the Consiglio Regionale. Coverage from 1964 (first legislature)
    to present. Full text extracted from structured HTML (NIR format).

fetch:
  max_retries: 3
  rate_limit: 1.5
  timeout: 60

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: law_number
      type: string
      required: false

license:
  name: "Public domain (official acts)"
  url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1941-04-22;633!vig="
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Regional laws are official acts of a public administration and are not
    protected by copyright under Art. 5 of the Italian Copyright Law
    (Legge 22 aprile 1941, n. 633).
