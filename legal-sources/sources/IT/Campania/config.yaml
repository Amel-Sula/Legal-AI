  name: Legislazione Regionale Campania
  country: IT
  url: https://www.regione.campania.it/normativa/items.php?pgCode=G19I231&id_doc_type=1
  data_types:
    - legislation
  auth: none
  description: >
    Regional laws (leggi regionali) of Campania from the Normativa section
