  max_retries: 3
  rate_limit: 1.5
  timeout: 30

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: law_number
      type: string
      required: false

license:
