source:
  id: LS/WIPOLex
  country: LS
  name: "Lesotho Legislation (WIPO Lex)"
  url: https://www.wipo.int/wipolex/en/members/profile/LS
  data_types:
    - legislation
  language: en
license:
  name: "Public domain (national legislation)"
  url: https://www.wipo.int/wipolex/en/disclaimer
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    The documents are official legislative texts of the Kingdom of Lesotho
    (acts, codes, orders), which are not subject to copyright. WIPO Lex
    republishes them free of charge as a public gateway. No usage restriction is
    placed on the underlying legal texts.
fetcher:
  type: html_profile_pdf
  rate_limit: 1.5
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: title
      required: true
      type: string
    - name: text
      required: true
      type: string
  date_fields:
    - _fetched_at
    - date
  text_fields:
    - text
    - title
data_model:
  update_strategy: upsert
  dedup_key:
    - _id
notes: >
  Lesotho legislation (industrial-property and copyright laws/codes, commercial,
  investment and related acts) from the WIPO Lex database. The member profile is
  server-rendered HTML listing each text with adoption date + detail-page link;
  each detail page exposes a CloudFront-signed PDF URL (signed query string
  required). Full text extracted from PDFs (English, Lesotho's legislative
  language).
