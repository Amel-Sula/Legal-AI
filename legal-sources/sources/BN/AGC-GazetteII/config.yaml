source:
  id: BN/AGC-GazetteII
  name: Brunei Attorney General — Government Gazette Part II (Subsidiary Legislation)
  country: BN
  url: https://www.agc.gov.bn/lists/gazetteii/allitems.aspx
  description: >
    Government Gazette Part II from Brunei's Attorney General's Chambers.
    Contains subsidiary legislation, orders, notifications, and regulations
    from 1998-2026. ~500+ items with full text extracted from PDFs.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: notification_no
      type: string
      required: false
    - name: gazette_no
      type: string
      required: false
    - name: year
      type: integer
      required: true
    - name: pdf_url
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: "Public Domain (Government of Brunei)"
  url: "https://www.agc.gov.bn"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government legislation published for public access"
