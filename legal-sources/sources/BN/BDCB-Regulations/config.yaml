source:
  id: "BN/BDCB-Regulations"
  country: "BN"
  name: "Brunei Darussalam Central Bank — Regulations & Guidelines"
  url: "https://www.bdcb.gov.bn/regulatory/regulations"
  description: |
    Regulatory documents from the Brunei Darussalam Central Bank (BDCB),
    formerly the Autoriti Monetari Brunei Darussalam (AMBD). Covers banking,
    capital markets, insurance/takaful, AML/CFT, FinTech, payment systems.
    ~340 documents including guidelines, notices, legislation, and directives.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

endpoints:
  listing: "https://www.bdcb.gov.bn/regulatory/regulations?page={page}"
  pdf_base: "https://cms.bdcb.gov.bn/storage/uploads/regulatories/"

data_model:
  update_strategy: "upsert"
  table: "doctrine"

schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: title
      required: true
      type: string
    - name: text
      required: true
      type: string
    - name: url
      required: true
      type: string
    - name: date
      required: false
      type: string
    - name: doc_type
      required: false
      type: string
  date_fields:
    - _fetched_at
  text_fields:
    - text
    - title

license:
  name: "Public Domain (Government)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government regulatory documents published for public access."
