source:
  id: "CI/LoiDiCI"
  country: "CI"
  name: "LoiDiCI — Codes et Textes Juridiques Ivoiriens"
  url: "https://loidici.biz/"
  description: |
    Côte d'Ivoire legal codes and legislation published article-by-article
    on a WordPress site. 15,000+ posts covering 30+ legal codes (Civil, Penal,
    Labor, Constitution, etc.) plus court decisions. Content in French.
    Accessible via WordPress REST API.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: "rest"
  base_url: "https://loidici.biz/wp-json/wp/v2"
  endpoints:
    list: "/posts?per_page=100&page={page}"
    categories: "/categories?per_page=100"

data_model:
  type: "legislation"
  source_nature: "consolidated"
  primary_key: "post_id"
  update_strategy: "upsert"
  dedup_key:
    - "post_id"

schema:
  total_fields: 10
  key_fields:
    - name: "_id"
      description: "Unique identifier (CI-LOIDICI-{post_id})"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Article title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the legal article"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Publication date"
      type: "date"
      role: "temporal_key"
      required: true

license:
  id: "pd-gov"
  name: "Public Domain (Government Acts)"
  url: "https://loidici.biz/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Underlying legal texts are public domain government acts. Site claims 'all rights reserved' on its compilation but the statutory texts themselves are not copyrightable."
