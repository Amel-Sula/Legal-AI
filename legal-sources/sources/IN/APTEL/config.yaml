fetch:
  max_retries: 3
  rate_limit: 2.0
  timeout: 60
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: case_no
    required: false
    type: string
  - name: cause_title
    required: false
    type: string
  - name: bench
    required: false
    type: string
  - name: decision_date
    required: false
    type: string
source:
  auth: none
  country: IN
  data_types:
  - case_law
  description: >
    Judgments and orders from the Appellate Tribunal for Electricity (APTEL),
    India. Appeals from CERC and all State Electricity Regulatory Commissions,
    plus PNGRB appeals. ~3000 judgments from 2008-present, all as PDFs with
    selectable text. Scraped from the Drupal-based official website, filtered
    by year.
  id: IN/APTEL
  name: Appellate Tribunal for Electricity
  url: https://aptel.gov.in/
license:
  name: "Government Open Data"
  url: "https://aptel.gov.in/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Indian government tribunal decisions are public records."
