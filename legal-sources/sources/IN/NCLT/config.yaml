fetch:
  max_retries: 3
  rate_limit: 2.0
  timeout: 60
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: case_no
    required: false
    type: string
  - name: company
    required: false
    type: string
  - name: order_type
    required: false
    type: string
  - name: bench
    required: false
    type: string
source:
  auth: none
  country: IN
  data_types:
  - case_law
  description: >
    Insolvency and corporate resolution orders from the National Company Law
    Tribunal (NCLT), India. Covers IBC admissions, liquidation, resolution plans,
    dissolution, and related proceedings across all 20+ NCLT benches. Orders
    aggregated via IBBI (ibbi.gov.in/orders/nclt) with downloadable PDFs.
    ~30,000+ orders from 2017–present.
  id: IN/NCLT
  name: National Company Law Tribunal
  url: https://nclt.gov.in/
license:
  name: "Government Open Data"
  url: "https://ibbi.gov.in/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Indian government tribunal decisions are public records. Orders aggregated by IBBI."
