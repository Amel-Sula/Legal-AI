notes: >
  Madagascar all-courts decisions via Juricaf (AHJUCAF francophone court decisions database).
  ~3,222 decisions across Cour suprême (3,060), Haute cour constitutionnelle (147),
  Cour de cassation (15). Full text in French. ODbL 1.0.
  Supersedes MG/CourSupremeJuricaf (500+ Cour suprême only); DB dedup handles overlap.
