source:
  id: "SO/SomalilandLaw"
  country: "SO"
  name: "Somaliland Law — Somaliland Legislation Collection"
  url: "http://www.somalilandlaw.com/"
  description: |
    Comprehensive collection of Somaliland legislation maintained by the
    International Journal of Somaliland Law. 600+ PDFs covering constitution,
    penal code, civil code, election laws, judiciary laws, and more.
    English, Somali, Italian, and Arabic documents.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.67
  burst: 2

api:
  type: "html_scrape"
  base_url: "http://www.somalilandlaw.com"

data_model:
  type: "legislation"
  source_nature: "consolidated"
  primary_key: "pdf_filename"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "pdf_filename"

schema:
  total_fields: 9
  key_fields:
    - name: "_id"
      description: "Unique identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title (from filename)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Year extracted from filename"
      type: "date"
      role: "temporal_key"
      required: false

license:
  id: "ogd"
  name: "Open Academic Access"
  url: "http://www.somalilandlaw.com/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Government legislation hosted by academic journal. HTTPS not supported — HTTP only."
