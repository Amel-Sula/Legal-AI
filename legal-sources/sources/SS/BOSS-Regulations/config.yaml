source:
  id: SS/BOSS-Regulations
  name: Bank of South Sudan — Regulations & Circulars
  country: SS
  url: https://boss.gov.ss/
  data_types:
    - legislation
    - doctrine
  description: |
    Regulatory documents from the Bank of South Sudan (BoSS) — banking acts,
    regulations, circulars, and guidelines. ~46 documents across Acts,
    Regulations, and Circulars sections. Full text from PDFs. English.

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: html_scrape_pdf
  base_url: https://boss.gov.ss
  format: pdf
  listing_urls:
    - /acts/
    - /regulations/
    - /circulars/

schema:
  key_fields:
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: string
      required: false
    - name: pdf_url
      type: string
      required: true

license:
  name: Public Domain (Government of South Sudan)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Official central bank regulations published for public access on boss.gov.ss.
