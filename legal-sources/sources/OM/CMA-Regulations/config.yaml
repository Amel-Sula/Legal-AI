# OM/CMA-Regulations -- Oman Capital Market Authority / Financial Services Authority Legislation
source:
  id: "OM/CMA-Regulations"
  name: "Oman Capital Market Authority — Regulations"
  url: "https://e.fsa.gov.om/LegislationEncyclopedia/"
  country: "OM"
  data_types:
    - legislation
    - doctrine
  auth:
    type: none
  license: "Open Government Data"

rate_limit:
  requests_per_second: 0.5
  burst: 2

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: _source
      type: string
      required: true
    - name: _type
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: string
      required: false
    - name: url
      type: string
      required: true

data_model:
  update_strategy: upsert
  dedup_key:
    - _id

license:
  name: "Open Government Data"
  url: null
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official legislation published by the Financial Services Authority (formerly Capital Market Authority) of Oman via its public Legislation Encyclopedia. Government-issued laws, regulations and decisions are in the public domain."
