# ===================================================================
# BH/PDP -- Bahrain Personal Data Protection Authority
# ===================================================================
# The PDPL (Law No. 30 of 2018), its royal decree, and executive
# decisions/orders issued by the Personal Data Protection Authority.
#
# Primary: HTML scraping of pdp.gov.bh static pages, PDFs on S3.
# ===================================================================

source:
  id: "BH/PDP"
  country: "BH"
  name: "Bahrain Personal Data Protection Authority"
  url: "https://www.pdp.gov.bh/en/regulations.html"
  description: |
    The Personal Data Protection Law (PDPL, Law No. 30 of 2018), the
    underlying royal decree, and the executive orders/decisions issued
    by the Bahraini Personal Data Protection Authority covering auditor
    fees, complaints, sensitive-data processing, cross-border transfers
    and other PDPL implementation rules.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_scraping"
  base_url: "https://www.pdp.gov.bh/en"
  listing_pages:
    - "regulations.html"
    - "royal-decree.html"
    - "executive-decisions.html"

data_model:
  type: "doctrine"
  primary_key: "doc_id"
  update_strategy: "upsert"
  dedup_key:
    - "doc_id"

schema:
  total_fields: 9
  key_fields:
    - name: "doc_id"
      description: "Stable id derived from the PDF path"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Human-readable document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full markdown/text extracted from the PDF"
      type: "string"
      role: "content"
      required: true
    - name: "url"
      description: "Landing page URL"
      type: "string"
      role: "reference"
      required: true
    - name: "pdf_url"
      description: "Direct PDF URL"
      type: "string"
      role: "reference"
      required: true
    - name: "category"
      description: "Law | Royal Decree | Executive Decision"
      type: "string"
      role: "category"
      required: true
    - name: "language"
      description: "en or ar"
      type: "string"
      role: "metadata"
      required: true

license:
  name: "Public Domain (Government of Bahrain)"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official Bahrain government publication; no copyright restriction asserted."

notes: |
  - ~22 PDFs across 3 landing pages (regulations, royal decree, executive decisions)
  - CloudFront blocks the default requests UA — pdf_bytes path used to bypass
  - PDFs are mix of Arabic and English; both are kept with distinct doc_ids
  - No date metadata exposed on the landing pages
