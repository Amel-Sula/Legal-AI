# ===================================================================
# ZM/BOZ-Directives -- Bank of Zambia Regulatory Framework
# ===================================================================
# Directives, circulars, regulations, acts, guidelines, and orders
# from the Bank of Zambia. Content accessed via Drupal JSON:API with
# full text extracted from attached PDF documents.
# ===================================================================

source:
  id: "ZM/BOZ-Directives"
  country: "ZM"
  name: "Bank of Zambia — Directives & Circulars"
  url: "https://www.boz.zm/"
  description: |
    Regulatory framework documents from the Bank of Zambia including
    directives, circulars, acts of parliament, regulations, rules,
    guidelines, and orders. Accessed via Drupal JSON:API endpoint
    with PDF full text extraction.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3
  notes: "Drupal JSON:API. Angular SPA frontend but API accessible directly."

api:
  type: "rest"
  base_url: "https://www.boz.zm"
  endpoints:
    regulatory_framework: "/jsonapi/node/regulatory_framework?page[limit]=50&include=field_regulatory_file,field_regulatory_framework_categ"
    categories: "/jsonapi/taxonomy_term/regulatory_framework_categories"
  response_format: "jsonapi"
  notes: "Drupal JSON:API (spec: jsonapi.org). Pagination via links.next."

schema:
  total_fields: 8
  key_fields:
    - name: "_id"
      description: "Drupal node ID"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Regulatory date or creation date"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "url"
      description: "URL to original PDF document"
      type: "string"
      role: "reference"
      required: true
    - name: "category"
      description: "Document category (Acts, Regulations, Directives, etc.)"
      type: "string"
      role: "classification"
      required: false

license:
  name: "Public Domain (Bank of Zambia)"
  url: "https://www.boz.zm/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Central bank regulatory documents published for public access."
