# ===================================================================
# SN/CourDesComptes -- Cour des Comptes du Sénégal
# ===================================================================

source:
  id: "SN/CourDesComptes"
  country: "SN"
  name: "Cour des Comptes du Sénégal"
  url: "https://www.courdescomptes.sn/"
  description: |
    Audit reports, court decisions (arrêts), legal texts, and publications
    from Senegal's Court of Auditors. 268 PDFs via WP Media API with
    text extraction, plus 201 posts with inline text.

data_types:
  - case_law
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "wordpress_rest"
  base_url: "https://www.courdescomptes.sn/wp-json/wp/v2"
  endpoints:
    - "/media?media_type=application (268 PDFs)"
    - "/posts (201 posts)"
    - "/categories"
  notes: "Reports, arrêts, legal texts. PDFs extracted via pdfplumber."

data_model:
  type: "doctrine"
  primary_key: "_id"
  update_strategy: "append_only"

schema:
  total_fields: 10
  key_fields:
    - name: "text"
      description: "Full text from PDF or WP post content"
      type: "string"
      role: "content"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "document_type"
      description: "Category: rapport, arret, loi, decret, communique, etc."
      type: "string"
      role: "status"
      required: false

license:
  name: "Public Government Documents (Senegal)"
  url: null
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official audit reports and court decisions from Senegal"
