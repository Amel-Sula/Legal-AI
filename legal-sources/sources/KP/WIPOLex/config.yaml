source:
  id: KP/WIPOLex
  country: KP
  name: "North Korea (DPRK) Legislation (WIPO Lex)"
  url: https://www.wipo.int/wipolex/en/members/profile/KP
  data_types:
    - legislation
  language: en
license:
  name: "Public domain (national legislation)"
  url: https://www.wipo.int/wipolex/en/disclaimer
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    The documents are official legislative texts of the Democratic People's
    Republic of Korea (laws, regulations), which are not subject to copyright.
    WIPO Lex republishes them free of charge as a public gateway. No usage
    restriction is placed on the underlying legal texts.
fetcher:
  type: html_profile_pdf
  rate_limit: 1.5
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: title
      required: true
      type: string
    - name: text
      required: true
      type: string
  date_fields:
    - _fetched_at
    - date
  text_fields:
    - text
    - title
data_model:
  update_strategy: upsert
  dedup_key:
    - _id
notes: >
  North Korea (DPRK) legislation (Intellectual Property Law, Laws on Inventions,
  Industrial Designs, Trademarks, Copyright, and related acts) from the WIPO Lex
  database. North Korea has no public government legislation portal reachable
  from outside the country; WIPO Lex is effectively the only machine-readable
  DPRK statute source without authentication. The member profile is
  server-rendered HTML listing each text with adoption date + detail-page link;
  each detail page exposes a CloudFront-signed PDF URL (signed query string
  required). Full text extracted from PDFs (English preferred, Korean fallback).
