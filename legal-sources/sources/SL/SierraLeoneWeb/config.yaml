source:
  id: SL/SierraLeoneWeb
  country: SL
  name: "Sierra Leone Web Laws Archive"
  url: https://www.sierra-leone.org
  data_types:
    - legislation
  language: en
license:
  name: "Public Domain"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Government legislation is public domain. Site is independent archive."
fetcher:
  type: html_scrape
  pagination: none
  rate_limit: 1.0
  requires_pdf_extraction: true
schema:
  key_fields:
    - name: _id
      required: true
      type: string
    - name: document_type
      required: false
      type: string
  date_fields:
    - date
    - _fetched_at
  text_fields:
    - text
    - title
notes: >
  ~600+ laws and ordinances from sierra-leone.org.
  Post-independence Acts (1960-2021) and colonial Ordinances (Caps 1-295).
  All PDF documents with pdfplumber text extraction.
