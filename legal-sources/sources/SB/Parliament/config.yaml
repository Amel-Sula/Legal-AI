source_id: SB/Parliament
name: Solomon Islands Parliament Acts
country: SB
url: https://parliament.gov.sb/
description: |
  Acts of the National Parliament of Solomon Islands, from 1981 to present.
  Covers all enacted legislation available on the official Parliament website.
  Documents are PDFs served via a JSON API endpoint.

data_types:
  - legislation

license:
  name: "Open government data"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official Solomon Islands parliamentary legislation"

language: en

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 3

update_frequency: quarterly

schema:
  key_fields:
    - name: title
      required: true
      type: string
    - name: year
      required: true
      type: integer
  date_field: date
  text_field: text
  title_field: title
  url_field: url

notes: |
  Parliament website serves acts via JSON API (get_acts.php?year=YYYY).
  PDFs are downloaded and text extracted via pdfplumber.
  Coverage: 1981-2025, ~480 acts total.
