source_id: "ER/Legislation"
name: "Eritrea Official Gazette — Library of Congress Collection"
country: ER
url: "https://www.loc.gov/collections/foreign-legal-gazettes/"
description: >
  Gazette of Eritrean Laws: Proclamations and Legal Notices (1991–2022),
  digitized by the Library of Congress Law Library. ~390 items with direct PDF
  downloads and structured metadata via the LOC JSON API.
data_types:
  - legislation
auth:
  type: none
rate_limit:
  requests_per_second: 1
  burst: 2
schema:
  key_fields:
    - _id
    - title
    - date
    - text
    - url
    - _source
    - _type
    - _fetched_at
license:
  name: "No known restrictions"
  url: "https://www.loc.gov/legal/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "LOC states 'No known restrictions on use or reproduction' for this collection."
