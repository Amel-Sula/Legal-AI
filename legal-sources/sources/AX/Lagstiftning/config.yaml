name: Åland Legislation (Ålex consolidated laws)
notes: >
  Ålex is the consolidated/updated collection of Åland Islands legislation
  maintained by Ålands landskapsregering (Government of Åland). Contains ~517
  consolidated laws with amendments incorporated into the text. Swedish language.
  Drupal CMS with paginated listing at /alex?page={n}.
schema:
  date_format: ISO8601
  key_fields:
