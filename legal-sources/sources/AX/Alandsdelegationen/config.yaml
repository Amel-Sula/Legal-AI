name: "Åland Delegation Opinions (Ålandsdelegationens utlåtanden)"
notes: >
  Ålandsdelegationen issues formal opinions (utlåtanden) under § 56 of the Act on
  the Autonomy of Åland on the division of legislative/administrative competence
  between Finland and the autonomous province of Åland. Newer years (2025+) attach
  the full opinion as a PDF; older years (2007-2024) embed the full text inline as
  list items under div.view-content. Swedish language.
