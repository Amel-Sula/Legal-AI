source:
  id: TL/ATTL-TaxRulings
  name: Timor-Leste Tax Authority — Public Rulings
  country: TL
  url: https://attl.gov.tl/public-ruling/
  description: >
    Public rulings from the Autoridade Tributária de Timor-Leste (ATTL).
    Covers income tax, withholding tax, depreciation, residency, and
    other tax topics. Multilingual (English, Portuguese, Indonesian).
    Full text extracted from PDFs.

data_model:
  types:
    - doctrine
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: language
      type: string
      required: true
    - name: ruling_number
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: Public Domain (Government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Timor-Leste government tax rulings published for public access
