source:
  id: "CO/FiscaliaGeneral"
  country: "CO"
  name: "Fiscalía General de la Nación - Normatividad"
  url: "https://www.fiscalia.gov.co/colombia/la-entidad/normatividad/"
  description: |
    Normative documents from Colombia's Attorney General's Office (Fiscalía General
    de la Nación): decrees, resolutions, directives, agreements, and laws.
    ~186 PDF documents in Spanish. Covers salary regulations, institutional policies,
    criminal procedure guidelines, and more.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 2

api:
  type: "html_scrape"
  base_url: "https://www.fiscalia.gov.co"

data_model:
  type: "doctrine"
  source_nature: "regulatory_documents"
  primary_key: "pdf_filename"
  update_strategy: "upsert"
  dedup_key:
    - "pdf_filename"

schema:
  total_fields: null
  key_fields:
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "description"
      description: "Brief description of the document"
      type: "string"
      role: "content"
      required: false
    - name: "doc_type"
      description: "Type of document (decreto, resolucion, directiva, etc.)"
      type: "string"
      role: "reference"
      required: false
  secondary_fields: []
  probably_ignorable: []

license:
  id: "ogd"
  name: "Open Government Data (Colombia)"
  url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=56882"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Colombian Ley 1712 de 2014 (Transparency and Access to Public Information)"
