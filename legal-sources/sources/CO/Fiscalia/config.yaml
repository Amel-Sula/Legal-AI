source:
  id: CO/Fiscalia
  country: CO
  name: Fiscalia General de la Nacion - Colombia
  url: https://www.fiscalia.gov.co/colombia/

data:
  types:
    - doctrine
  language: spa
  coverage: Official press releases and communications from Colombia's Fiscalía General de la Nación (Attorney General's Office / Prosecution Service). Covers organized crime prosecutions, corruption cases, human rights cases, environmental crime, and institutional announcements. 67,000+ documents from 2013 to present.
  volume: 67,000+ documents

access:
  auth: none
  license: Open Government Data (Colombia - Ley 1712 de 2014)
  rate_limit: 1 request per 1.5 seconds

endpoints:
  base_url: https://www.fiscalia.gov.co/colombia/wp-json/wp/v2/
  posts: posts?per_page=100&page={page}&_fields=id,date,title,content,link,categories

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: title
      type: string
      required: true
  metadata:
    - date
    - url
    - categories

license:
  name: "Open Government Data (Colombia)"
  url: "https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=56882"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Colombian Ley 1712 de 2014 (Transparency and Access to Public Information)"

notes: |
  Fiscalía General de la Nación publishes official communications via a WordPress site.
  The WP REST API (/wp-json/wp/v2/posts) provides paginated access to all 67K+ posts
  with full HTML content. Content is stripped of HTML tags during normalization.
  Categories include: organized crime, corruption, human rights, environmental crime.
