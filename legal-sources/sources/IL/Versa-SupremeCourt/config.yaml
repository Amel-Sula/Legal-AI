source_id: IL/Versa-SupremeCourt
name: Israeli Supreme Court Decisions (English Translations)
country: IL
url: https://versa.cardozo.yu.edu/opinions
description: |
  Curated English translations of Israeli Supreme Court decisions (1940-2026)
  from the Cardozo Israeli Supreme Court Project at Benjamin N. Cardozo School
  of Law, Yeshiva University. ~419 opinions covering Constitutional Law,
  Administrative Law, Criminal Law, and other topics. Scraped from HTML pages
  via the site map.

data_types:
  - case_law

license:
  name: "Yeshiva University Terms of Use"
  url: "https://versa.cardozo.yu.edu/terms-and-conditions"
  commercial_use: false
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Academic translations of Israeli Supreme Court decisions. Original decisions are public domain; English translations copyright Cardozo Law School / Yeshiva University."

language: en

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

update_frequency: quarterly

schema:
  key_fields:
    - name: title
      required: true
      type: string
    - name: case_number
      required: false
      type: string
  date_field: date
  text_field: text
  title_field: title
  url_field: url
