source:
  id: BB/ParliamentLaws
  name: Barbados Parliament — Laws & Statutory Instruments
  country: BB
  url: https://www.barbadosparliament-laws.com/en
  description: >
    Consolidated statutes and subsidiary legislation of Barbados from the
    Parliament website. ~623 consolidated statutes, ~545 acts, and ~1936
    statutory instruments. Full text extracted from PDFs served via CloudFront.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: doc_type
      type: string
      required: true
    - name: pdf_url
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: Public domain (government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Government of Barbados public legislation
