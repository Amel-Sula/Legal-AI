id: TR/MFA-Treaties
name: Turkish International Agreements (MFA Treaties Database)
country: TR
url: https://ua.mfa.gov.tr
description: >
  Database of international agreements (Uluslararası Antlaşmalar) to which the
  Republic of Türkiye is a party, published by the Ministry of Foreign Affairs.
  Covers bilateral and multilateral treaties. Each entry carries structured
  metadata (parties, subject, signature place/date, Resmî Gazete publication
  reference) and the full text of the ratification law and the treaty itself,
  extracted from the associated PDF documents (as published in the Resmî Gazete).
  Older treaties (pre-~1990) are stored as scanned image PDFs without an OCR
  layer and are skipped; modern treaties yield full machine-readable text.
data_types:
  - legislation
auth:
  type: none
rate_limit:
  requests_per_second: 1
  burst: 2
data_model:
  update_strategy: upsert
  dedup_key:
    - _id
schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: _source
      type: string
      required: true
    - name: _type
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: url
      type: string
      required: true
license:
  name: "Public Domain (Turkish official texts — Law No. 5846 art. 31)"
  url: "https://www.mevzuat.gov.tr/MevzuatMetin/1.3.5846.pdf"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: >
    Under Article 31 of Turkish Law No. 5846 on Intellectual and Artistic Works,
    officially promulgated laws, regulations, and treaties (and their official
    texts published in the Resmî Gazete) are not subject to copyright protection.
    International agreements ratified by Türkiye are public official texts.
