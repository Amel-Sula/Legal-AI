# ===================================================================
# BW/NBFIRA -- Non-Bank Financial Institutions Regulatory Authority
# ===================================================================
# Prudential rules, enforcement notices, circulars, tribunal
# judgements, and regulatory guidance from NBFIRA Botswana.
# ===================================================================

source:
  id: "BW/NBFIRA"
  country: "BW"
  name: "Non-Bank Financial Institutions Regulatory Authority"
  url: "https://www.nbfira.org.bw/"
  description: |
    Regulatory publications from Botswana's NBFIRA covering insurance,
    pensions, capital markets, virtual assets, and microlending.
    Includes tribunal judgements, public notices, enforcement actions,
    circulars, and regulatory guidance. Data fetched via WordPress
    REST API (full text in content field, no PDF extraction needed).

data_types:
  - doctrine
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "wordpress_rest"
  base_url: "https://www.nbfira.org.bw/wp-json/wp/v2"
  endpoints:
    - "/posts?per_page=100"
    - "/tribunal-judgements?per_page=100"
  notes: "WordPress REST API — full text in content.rendered, paginated"

data_model:
  type: "mixed"
  primary_key: "url"
  update_strategy: "upsert"

schema:
  total_fields: 12
  key_fields:
    - name: "text"
      description: "Full text extracted from WordPress content"
      type: "string"
      role: "content"
      required: true
    - name: "title"
      description: "Post or judgement title"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Publication date"
      type: "date"
      role: "temporal_key"
      required: true

license:
  name: "Public Government Documents (Botswana)"
  url: null
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory documents published for public compliance use"
