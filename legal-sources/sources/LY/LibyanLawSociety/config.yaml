source:
  id: "LY/LibyanLawSociety"
  country: "LY"
  name: "Libyan Law and Society — Leiden/Benghazi Academic Collection"
  url: "https://www.libyanlawandsociety.org/legal-documents"
  description: |
    Academic collaboration between Benghazi Centre for Law and Leiden University.
    17 hard-to-find Libyan legal documents including constitutional declarations,
    court rulings, decrees, and laws. PDFs in English.

data_types:
  - legislation
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 0.5
  burst: 2

api:
  type: "html_scrape"
  base_url: "https://www.libyanlawandsociety.org"

data_model:
  type: "legislation"
  source_nature: "consolidated"
  primary_key: "pdf_filename"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "pdf_filename"

schema:
  total_fields: 9
  key_fields:
    - name: "_id"
      description: "Unique identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Year of document"
      type: "date"
      role: "temporal_key"
      required: false

license:
  id: "ogd"
  name: "Open Academic Access"
  url: "https://www.libyanlawandsociety.org/legal-documents"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Academic collection of official Libyan government legislation. Attribution to Leiden/Benghazi collaboration."
