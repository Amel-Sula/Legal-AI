source:
  id: "US/NCUA-Enforcement"
  country: "US"
  name: "NCUA Administrative Orders (Credit Union Enforcement)"
  url: "https://ncua.gov/news/enforcement-actions/administrative-orders"
  description: |
    Enforcement actions from the National Credit Union Administration since
    1991. Includes cease-and-desist orders, prohibition orders, and civil
    money penalty orders against credit unions and affiliated individuals.

data_types:
  - case_law

auth:
  type: "none"

rate_limit:
  requests_per_second: 2
  burst: 5
  max_workers: 3

api:
  type: "rest"
  base_url: "https://ncua.gov"
  endpoints:
    csv: "/sites/default/files/list_csv/administrative-orders.csv"
    detail: "/news/enforcement-actions/administrative-orders/{year}/{slug}"

data_model:
  type: "case_law"
  source_nature: "gazette"
  primary_key: "docket_number"
  update_strategy: "append_only"
  versioning: "none"
  dedup_key:
    - "docket_number"

schema:
  total_fields: 14
  key_fields:
    - name: "_id"
      description: "Docket number (e.g., 26-0041-WR)"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Title of the enforcement action"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the order"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Year of the order"
      type: "string"
      role: "temporal_key"
      required: true
  secondary_fields:
    - name: "first_name"
      description: "First name of the individual"
    - name: "last_name"
      description: "Last name of the individual"
    - name: "institution"
      description: "Credit union name"
    - name: "relationship"
      description: "Relationship to institution"
    - name: "city"
      description: "City"
    - name: "state"
      description: "State"
  probably_ignorable: []

license:
  id: "pd-us"
  name: "U.S. Public Domain"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "U.S. government works are in the public domain."

notes: |
  - 1,428 enforcement actions since 1991
  - Newer orders (post-~2019) are HTML pages; older ones are PDFs
  - CSV index available for all records
  - English language
