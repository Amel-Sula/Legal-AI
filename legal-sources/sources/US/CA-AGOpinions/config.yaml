# ===================================================================
# US/CA-AGOpinions -- California Attorney General Formal Opinions
# ===================================================================
# Full text of formal legal opinions issued by the California Attorney
# General. These are official state legal interpretations (doctrine).
# Published openly as PDFs, indexed by year at oag.ca.gov/opinions.
# No authentication required. Public government data.
# ===================================================================

source:
  id: "US/CA-AGOpinions"
  country: "US"
  name: "California Attorney General Formal Opinions"
  url: "https://oag.ca.gov/opinions"
  description: |
    Formal legal opinions issued by the California Office of the Attorney
    General. Each opinion answers a legal question posed by a public
    official and constitutes an authoritative (though advisory) state legal
    interpretation. Full text extracted from official PDFs. Coverage from
    1976 to present via the yearly index.

data_types:
  - doctrine

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 2

api:
  type: "html_scraping"
  base_url: "https://oag.ca.gov"
  endpoints:
    yearly_index: "/opinions/yearly-index?conclusion-year%5Bvalue%5D%5Byear%5D={year}"
    pdf: "/system/files/opinions/pdfs/{number}.pdf"

data_model:
  type: "doctrine"
  primary_key: "opinion_number"
  update_strategy: "full_replace"
  dedup_key:
    - "opinion_number"

schema:
  total_fields: 9
  key_fields:
    - name: "opinion_number"
      description: "Official AG opinion number (e.g., '25-902')"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Opinion title (question presented)"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text of the opinion extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "question"
      description: "Question presented to the Attorney General"
      type: "string"
      role: "content"
      required: false
    - name: "conclusion"
      description: "Summary conclusion(s) reached"
      type: "string"
      role: "content"
      required: false
    - name: "date"
      description: "Date the opinion was issued (ISO 8601)"
      type: "date"
      role: "temporal_key"
      required: true

license:
  name: "Public Domain (US Government Work — California)"
  url: "https://www.law.cornell.edu/uscode/text/17/105"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "California Attorney General opinions are official state government works in the public domain."

notes: |
  - Formal AG opinions indexed by year at oag.ca.gov/opinions/yearly-index
  - Year filter query param: conclusion-year[value][year]=YYYY
  - Full text extracted from official PDFs via pdfplumber
  - ~6-15 opinions per year, 1976-present (~500+ documents)
  - Public domain California government data
