id: KE/EnvironmentTribunal
name: Kenya National Environment Tribunal Decisions
country: KE
url: https://new.kenyalaw.org/judgments/KENET/
description: >
  Decisions of the National Environment Tribunal - Nairobi (KENET),
  hosted on the Kenya Law PeachJam platform. ~155 decisions on environmental
  licensing appeals and impact assessments under EMCA. Full text extracted
  from inline HTML (AKN-structured pages).
data_types:
  - case_law
auth:
  type: none
rate_limit:
  requests_per_second: 0.2
  burst: 1
data_model:
  update_strategy: upsert
  dedup_key:
    - _id
schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: _source
      type: string
      required: true
    - name: _type
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: url
      type: string
      required: true
    - name: court
      type: string
      required: false
license:
  name: "Public Domain (Government)"
  url: "https://new.kenyalaw.org/about/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Kenya Law states content is in the public domain and free from copyright restrictions."
