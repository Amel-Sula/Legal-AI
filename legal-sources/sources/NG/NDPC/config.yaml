source_id: NG/NDPC
name: Nigeria Data Protection Commission — Enforcement & Regulations
country: NG
url: https://www.ndpc.gov.ng/
data_types:
  - doctrine
auth:
  type: none
schedule: monthly

schema:
  key_fields:
    - name: "_id"
      description: "Unique document identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text content"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Publication date"
      type: "date"
      role: "temporal_key"
      required: false
    - name: "document_type"
      description: "Document category"
      type: "string"
      role: "reference"
      required: false

license:
  name: "Custom Terms (Government)"
  url: "https://www.ndpc.gov.ng/"
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official Nigerian government data protection authority. Publications include the NDP Act 2023, GAID, enforcement orders, guidance notices, and regulatory instruments."
