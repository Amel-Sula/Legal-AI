source:
  id: NG/NERC
  name: Nigerian Electricity Regulatory Commission — Orders & Regulations
  country: NG
  url: https://nerc.gov.ng/
  language: en
  data_types:
    - doctrine
    - legislation

endpoints:
  base_url: https://nerc.gov.ng
  categories:
    - orders
    - regulations
    - codes
    - guidelines-standards
    - market-documents

rate_limit:
  requests_per_second: 0.5
  delay_seconds: 2.0

schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: _source
      type: string
      required: true
    - name: _type
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: false
    - name: url
      type: string
      required: true
    - name: category
      type: string
      required: false

data_model:
  update_strategy: upsert
  dedup_key:
    - _id

license:
  name: "Nigerian Government Open Data"
  url: "https://nerc.gov.ng/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official regulatory documents published by NERC for public access"
