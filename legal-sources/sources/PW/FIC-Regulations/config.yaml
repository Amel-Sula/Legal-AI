source:
  id: PW/FIC-Regulations
  name: Palau Financial Institutions Commission — Regulations
  country: PW
  url: https://ropfic.org/laws-regulations/
  description: >
    Palau FIC laws and prudential regulations. 5 applicable laws (Financial
    Institutions Act, Money Laundering Act, etc.) + 11 prudential regulations
    (PR/AR series) + corporate regulations. Full text extracted from PDFs.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: category
      type: string
      required: true
    - name: pdf_url
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: Public Domain (Government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: Republic of Palau government legislation and regulations
