source:
  id: ET/NBE-Directives
  name: Ethiopia National Bank — Directives
  country: ET
  url: https://nbe.gov.et/mandates/directives/
  description: >
    Banking, insurance, forex, microfinance, and payment systems directives
    from the National Bank of Ethiopia. 306 directives with full text PDFs.
    WordPress REST API at /wp-json/wp/v2/files.

data_model:
  types:
    - legislation
  update_strategy: upsert
  dedup_key:
    - doc_id

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

schema:
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url
  key_fields:
    - name: doc_id
      type: string
      required: true
    - name: pdf_url
      type: string
      required: false
    - name: directive_number
      type: string
      required: false

schedule:
  full_refresh: quarterly
  update_check: monthly

license:
  name: Public domain (government)
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: National Bank of Ethiopia public regulatory directives
