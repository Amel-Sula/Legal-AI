  country: ML
  name: "Mali Consolidated Legal Codes (SGG)"
  url: https://sgg-mali.ml
  api_url: https://sgg-mali.ml/fr/journal-officiel/les-codes-consolides.html
  data_types:
    - legislation
  language: fr
license:
  name: "Public Domain"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
