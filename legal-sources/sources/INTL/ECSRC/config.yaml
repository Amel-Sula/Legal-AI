  burst: 2

update_frequency: quarterly

schema:
  key_fields:
    - name: title
      required: true
      type: string
    - name: url
      required: true
      type: string
  date_field: date
  text_field: text
  title_field: title
  url_field: url

notes: |
  PDFs hosted on ecsrc.com via multiple path patterns:
  /gallery/documents/sendFile/{id}, /img/WorkflowsDocument/, /img/source/.
  Curated catalog approach — all known regulatory documents listed statically.
