source_id: INTL/ECSRC
name: Eastern Caribbean Securities Regulatory Commission
country: INTL
url: https://www.ecsrc.com/
data_url: https://www.ecsrc.com/cms/CmspageCategories/catalog/228
description: |
  Securities legislation, regulations, rules, policies, and guidelines from
  the Eastern Caribbean Securities Regulatory Commission (ECSRC). Covers the
  Securities Act 2001, securities regulations (prospectus, conduct of business,
  collective investment schemes, etc.), ECSRC rules (corporate governance,
  accounting, registration), policy statements, guidance notes, and proposed
  legislation. Applies to all ECCU member territories (AG, AI, DM, GD, KN,
  LC, VC, MS).

data_types:
  - legislation

license:
  name: Open Government Data
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official securities regulator publications"

language: en

auth:
  type: none

rate_limit:
