  delay_seconds: 1.5
notes: >
  ~65 anonymized decision excerpts (2017-2025) from INTERPOL's CCF,
  the quasi-judicial body overseeing Red Notices, diffusions, and data
  processing complaints. PDFs contain full decision text covering
  Article 2 (human rights), Article 3 (political offences), due process,
  ne bis in idem, extradition, and data quality issues.
license:
  name: INTERPOL Website Terms
  url: https://www.interpol.int/en/Terms-of-use
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: >
    CCF decisions are published on INTERPOL's website as public information.
    Anonymized excerpts provided for transparency under the CCF Statute.
