auth:
  type: none
base_url: https://www.unilex.info/
country: INTL
data_types:
- case_law
description: >
  UNILEX is a database produced by UNIDROIT containing case law on the UN
  Convention on Contracts for the International Sale of Goods (CISG) and the
  UNIDROIT Principles of International Commercial Contracts. ~2500 cases from
  courts and arbitral tribunals worldwide with English abstracts and full text
  in the original language.
language: multi
license:
  name: UNIDROIT Terms of Use
  url: https://www.unilex.info/
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: Academic/research database maintained by UNIDROIT.
name: UNILEX — CISG & UNIDROIT Principles Case Law Database
rate_limit:
  burst: 1
  requests_per_second: 0.5
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: case_number
    required: false
    type: string
source_id: INTL/UNILEX
