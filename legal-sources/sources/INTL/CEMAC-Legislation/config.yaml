source:
  id: "INTL/CEMAC-Legislation"
  country: "INTL"
  name: "CEMAC Legal Instruments"
  url: "https://cemac.int/"
  description: |
    Economic and Monetary Community of Central Africa (CEMAC) —
    regulations, directives, treaties and conventions.
    6 member states: CM, CF, CG, GA, GQ, TD. French language.
    Open access PDF documents from cemac.int.

data_types:
  - legislation

auth:
  type: "none"

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: "html_scrape"
  base_url: "https://cemac.int"

data_model:
  type: "legislation"
  source_nature: "consolidated"
  primary_key: "doc_id"
  update_strategy: "upsert"
  versioning: "none"
  dedup_key:
    - "_id"

schema:
  total_fields: null
  key_fields:
    - name: "_id"
      description: "Unique document identifier"
      type: "string"
      role: "primary_key"
      required: true
    - name: "title"
      description: "Document title"
      type: "string"
      role: "content"
      required: true
    - name: "text"
      description: "Full text content extracted from PDF"
      type: "string"
      role: "content"
      required: true
    - name: "date"
      description: "Publication or update date"
      type: "date"
      role: "temporal_key"
      required: false
  secondary_fields: []
  probably_ignorable: []

license:
  id: "ogd"
  name: "Open Government Data"
  url: "https://cemac.int/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official international organization documents published openly on cemac.int"
