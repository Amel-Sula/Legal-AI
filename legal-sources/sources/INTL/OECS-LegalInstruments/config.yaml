source_id: INTL/OECS-LegalInstruments
name: OECS Legal Instruments (Authority Communiqués, Statements & Declarations)
country: INTL
url: https://pressroom.oecs.int/
description: >
  Official communiqués, declarations, and statements of the Organisation of
  Eastern Caribbean States (OECS) Authority — the supreme policy-making body.
  11 member states: AG, DM, GD, KN, LC, VC, MS, AI, VG, MF, BVI.
  Fetched via Prezly JSON API (pressroom.oecs.int). Includes Authority meeting
  communiqués (64th–77th+), special/emergency meetings, ECCB Monetary Council
  communiqués, ECSC statements, and legal instruments. Open access.
data_types:
  - legislation
auth:
  type: none
rate_limit:
  requests_per_second: 0.7
  burst: 1
data_model:
  update_strategy: append_only
  dedup_key:
    - _id
schema:
  key_fields:
    - name: _id
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: string
      required: false
    - name: url
      type: string
      required: true
    - name: instrument_type
      type: string
      required: false
license:
  name: "OECS official publications"
  url: "https://oecs.int/"
  commercial_use: true
  attribution_required: true
  share_alike: false
  no_derivatives: false
  notes: "Official legal instruments and communiqués of an international organization, published for public access"
