  scope: 347f287d-d8af-4e21-85cc-0fba3730380c
  method: dspace7_api
  rate_limit_seconds: 1.5
schema:
  key_fields:
  - name: _id
    required: true
    type: string
  - name: title
    required: true
    type: string
  - name: text
    required: true
    type: string
  - name: date
    required: false
    type: date
