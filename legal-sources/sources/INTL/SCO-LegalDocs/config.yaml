# INTL/SCO-LegalDocs - Shanghai Cooperation Organisation Legal Documents
name: "Shanghai Cooperation Organisation Legal Documents"
country: INTL
source_id: "INTL/SCO-LegalDocs"
source_type: legislation

base_url: "https://eng.sectsco.org"
official_url: "https://eng.sectsco.org/documents/"

data_types:
  - legislation

languages:
  - en

coverage:
  start_year: 2001
  end_year: 2026
  notes: "SCO Charter, Shanghai Convention, conventions, treaties, declarations, joint communiqués, decisions, statements and protocols. ~117 documents."

auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 2

data_model:
  update_strategy: upsert
  dedup_key:
    - _id

schema:
  key_fields:
    - name: "text"
      type: "string"
      required: true
  required_fields:
    - _id
    - _source
    - _type
    - _fetched_at
    - title
    - text
    - url

license:
  name: "Open Government Data"
  url: null
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official legal instruments of the SCO published by the Secretariat for public reference. The site footer asserts copyright on the portal, but the underlying treaty/declaration texts are official intergovernmental instruments."
