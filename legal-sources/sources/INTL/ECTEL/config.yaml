      required: true
      type: string
    - name: url
      required: true
      type: string
  date_field: date
  text_field: text
  title_field: title
  url_field: url

notes: |
  PDFs hosted on ectel.int/wp-content/uploads/. Legislation pages use WordPress
  ACF with structured data tables. Curated catalog of ~95 documents across 5
  ECTEL member states (DM, GD, KN, LC, VC).
