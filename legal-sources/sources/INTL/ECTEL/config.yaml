source_id: INTL/ECTEL
name: Eastern Caribbean Telecommunications Authority
country: INTL
url: https://www.ectel.int/legislation/
data_url: https://www.ectel.int/wp-json/wp/v2/pages
description: |
  Telecommunications legislation, regulations, and statutory rules from the
  Eastern Caribbean Telecommunications Authority (ECTEL). Covers the
  Telecommunications Acts and ~20 subsidiary regulations per member state
  (Dominica, Grenada, St Kitts & Nevis, Saint Lucia, St Vincent & the
  Grenadines), plus the ECTEL Treaty and Electronic Communications Bill.
  Full text extracted from official PDFs hosted on ectel.int.

data_types:
  - legislation

