source_id: LV/KP
country: LV
name: Latvia Competition Council — Decisions
description: |
  Decisions (lēmumi) of the Latvia Competition Council
  (Konkurences padome). Covers mergers, prohibited agreements,
  abuse of dominance. Decisions from 2001 to present, published as PDFs.

data_types:
  - case_law

url: https://lemumi.kp.gov.lv/
auth:
  type: none

rate_limit:
  requests_per_second: 1
  burst: 3

api:
  type: html_scrape
  base_url: https://lemumi.kp.gov.lv
  list_url: https://lemumi.kp.gov.lv/?page={page}

data_model:
  type: case_law
  source_nature: gazette
  primary_key: decision_number
  update_strategy: append_only
  dedup_key:
    - decision_number

schema:
  key_fields:
    - name: decision_number
      type: string
      required: true
    - name: title
      type: string
      required: true
    - name: text
      type: string
      required: true
    - name: date
      type: date
      required: true

license:
  id: pd-gov
  name: Public Domain (Government decisions)
  url: https://www.kp.gov.lv/en
  commercial_use: true
  attribution_required: false
  share_alike: false
  no_derivatives: false
  notes: "Official government decisions published in the public interest."
